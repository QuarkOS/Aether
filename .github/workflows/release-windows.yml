name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win
      # Signing deferred for V1. Later: CSC_LINK / CSC_KEY_PASSWORD.
      - name: Upload installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apps/desktop/release/Aether-Setup-*.exe
          generate_release_notes: true
          body: |
            Unsigned Windows installer. SmartScreen may warn on first run.
            Choose More info → Run anyway if Windows blocks the file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Setup-windows
          path: apps/desktop/release/Aether-Setup-*.exe
